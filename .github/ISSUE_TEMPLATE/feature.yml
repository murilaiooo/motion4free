name: Prova técnica / funcionalidade
description: Uma proposta pequena, testável, ligada aos gates do roadmap
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: Que problema resolve e como seria usado?
      placeholder: "Como usuário, quero..."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Escopo e restrições
      description: O que entra e o que explicitamente não entra?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios verificáveis
      description: Inclua mídia real, fallback sem IA paga e testes.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Riscos, privacidade e licenças
      description: Referencie docs/risks.md quando aplicável.
